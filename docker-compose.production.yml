name: smk-alfatih

services:
  database:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - smk_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smk_private

  app:
    image: smk-alfatih-app:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env.production
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./storage:/var/www/html/storage
      - ./backups:/backups
    expose:
      - "80"
    networks:
      - smk_private
    labels:
      traefik.enable: "true"
      traefik.http.routers.smk-alfatih.entrypoints: websecure
      traefik.http.routers.smk-alfatih.rule: Host(`smktahfizhalfatih.otaniverse.org`)
      traefik.http.routers.smk-alfatih.tls.certresolver: letsencrypt
      traefik.http.routers.smk-alfatih.middlewares: smk-alfatih-security
      traefik.http.services.smk-alfatih.loadbalancer.server.port: "80"
      traefik.http.routers.smk-alfatih-legacy.entrypoints: websecure
      traefik.http.routers.smk-alfatih-legacy.rule: Host(`otaniverse.org`) || Host(`www.otaniverse.org`)
      traefik.http.routers.smk-alfatih-legacy.tls.certresolver: letsencrypt
      traefik.http.routers.smk-alfatih-legacy.middlewares: smk-alfatih-redirect
      traefik.http.routers.smk-alfatih-legacy.service: smk-alfatih
      traefik.http.middlewares.smk-alfatih-redirect.redirectregex.regex: ^https?://(?:www\.)?otaniverse\.org/(.*)
      traefik.http.middlewares.smk-alfatih-redirect.redirectregex.replacement: https://smktahfizhalfatih.otaniverse.org/$${1}
      traefik.http.middlewares.smk-alfatih-redirect.redirectregex.permanent: "true"
      traefik.http.middlewares.smk-alfatih-security.headers.contenttypenosniff: "true"
      traefik.http.middlewares.smk-alfatih-security.headers.framedeny: "true"
      traefik.http.middlewares.smk-alfatih-security.headers.referrerpolicy: strict-origin-when-cross-origin

  queue:
    image: smk-alfatih-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "33:33"
    env_file:
      - .env.production
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    healthcheck:
      disable: true
    volumes:
      - ./storage:/var/www/html/storage
      - ./backups:/backups
    networks:
      - smk_private

  scheduler:
    image: smk-alfatih-app:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "33:33"
    env_file:
      - .env.production
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_SSLMODE: disable
    depends_on:
      database:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    volumes:
      - ./storage:/var/www/html/storage
      - ./backups:/backups
    networks:
      - smk_private

volumes:
  smk_database:

networks:
  smk_private:
    driver: bridge
